<html><head><title>CSS image sizes</title>
<style>
.icon img { max-width: 15px }
img.small { width: 20px; height: auto }
img.tall { max-height: 12px }
</style></head><body>
<h2>CSS image sizes</h2>
<p class="icon">max-width: <img src="test.png" alt="a"></p>
<p>width, height auto: <img class="small" src="test.gif" width=64 height=48 alt="b"></p>
<p>max-height: <img class="tall" src="test.jpg" alt="c"></p>
<p>natural: <img src="test.png" alt="d"></p>
</body></html>
